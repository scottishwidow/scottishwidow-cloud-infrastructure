exit-code: 0
ignorefile: .trivyignore.yaml
timeout: 10m
severity:
  - MEDIUM
  - HIGH
  - CRITICAL
scan:
  scanners:
    - misconfig
    - secret
  skip-dirs:
    - "**/.terraform"
misconfiguration:
  scanners:
    - terraform
    - ansible
  checks-bundle-repository: ghcr.io/aquasecurity/trivy-checks:2.3.0@sha256:3eae4436560566e77115396d0221a64e0cd86d94a3b45203f8ae3f9a85c027cd
  terraform:
    exclude-downloaded-modules: false
