base_path: "."

version:
  constraint:
    require: "1.234.1"
    enforcement: fatal
    message: "This repository requires Atmos 1.232.0 exactly."

components:
  terraform:
    base_path: "live"
    apply_auto_approve: false
    deploy_run_init: true
    auto_generate_backend_file: false
    workspaces_enabled: false

stacks:
  base_path: "stacks"
  included_paths:
    - "**/*.yaml"
  excluded_paths:
    - "**/_*.yaml"
    - "workflows/**/*"

workflows:
  base_path: "stacks/workflows"
