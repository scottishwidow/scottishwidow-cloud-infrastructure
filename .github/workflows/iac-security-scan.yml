name: 'IaC security scan'

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: 'trivy.yaml'
          format: 'sarif'
          output: 'trivy-results.sarif'
          limit-severities-for-sarif: true
          version: 'v0.76.2'
          cache: 'false'

      - name: Drop duplicate results from modules with several callers
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          jq '.runs[].results |= unique_by([.ruleId, .locations, .message.text])' \
            trivy-results.sarif > trivy-results.dedup.sarif
          mv trivy-results.dedup.sarif trivy-results.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: 'trivy-results.sarif'
