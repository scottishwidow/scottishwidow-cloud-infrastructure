---
- name: Check the host network of the Sensor, then run its services
  hosts: sensors
  gather_facts: false

  roles:
    - sensor_network_check
    - log_volume
    - allowlist_proxy
    - suricata
    - evebox
    - sinkhole
    - time_server
    - corpus_credential
    - vector

- name: Harden SSH on every Honeynet host
  hosts: all
  gather_facts: false

  roles:
    - ssh_hardening

- name: Run the honeypots on every Honeypot
  hosts: honeypots
  gather_facts: false

  roles:
    - honeypot_docker
    - time_client
    - cowrie
    - opencanary
    - role: vector
      vars:
        vector_config_template: honeypot.yaml.j2
        vector_reader_groups:
          - "{{ cowrie_log_reader_group }}"
