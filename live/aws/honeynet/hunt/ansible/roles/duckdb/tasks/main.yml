---
- name: Create the DuckDB install directory
  ansible.builtin.file:
    path: "{{ duckdb_install_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the DuckDB command line
  ansible.builtin.get_url:
    url: "{{ duckdb_download_url }}"
    checksum: "{{ duckdb_download_checksum }}"
    dest: "{{ duckdb_install_directory }}/duckdb.gz"
    owner: root
    group: root
    mode: "0644"

- name: Unpack the DuckDB command line
  ansible.builtin.command:
    argv:
      - gzip
      - --decompress
      - --keep
      - "{{ duckdb_install_directory }}/duckdb.gz"
    creates: "{{ duckdb_install_directory }}/duckdb"

- name: Make the DuckDB command line executable
  ansible.builtin.file:
    path: "{{ duckdb_install_directory }}/duckdb"
    owner: root
    group: root
    mode: "0755"

- name: Put the pinned DuckDB command line on the path
  ansible.builtin.file:
    src: "{{ duckdb_install_directory }}/duckdb"
    dest: "{{ duckdb_path }}"
    state: link
    force: true
  register: duckdb_binary

- name: Create the DuckDB state and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ duckdb_state_directory }}"
    - "{{ duckdb_extension_directory }}"
    - "{{ duckdb_config_directory }}"

# Each hunt session spills into its own directory under here, so the directory is shared and sticky.
- name: Create the DuckDB spill directory on the gp3 volume
  ansible.builtin.file:
    path: "{{ duckdb_spill_directory }}"
    state: directory
    owner: root
    group: root
    mode: "1777"

# The DuckDB binary has no TLS client until httpfs loads, so INSTALL fetches over plain HTTP.
# The Hunt Host allows only HTTPS egress. DuckDB checks the extension signature at LOAD.
- name: Create the DuckDB extension directory for the pinned version
  ansible.builtin.file:
    path: "{{ duckdb_extension_install_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the DuckDB extensions that read the Corpus over S3
  ansible.builtin.get_url:
    url: "{{ duckdb_extension_download_url }}/{{ item.name }}.duckdb_extension.gz"
    checksum: "{{ item.checksum }}"
    dest: "{{ duckdb_extension_install_directory }}/{{ item.name }}.duckdb_extension.gz"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ duckdb_extensions }}"
  loop_control:
    label: "{{ item.name }}"

- name: Unpack the DuckDB extensions
  ansible.builtin.command:
    argv:
      - gzip
      - --decompress
      - --keep
      - "{{ duckdb_extension_install_directory }}/{{ item.name }}.duckdb_extension.gz"
    creates: "{{ duckdb_extension_install_directory }}/{{ item.name }}.duckdb_extension"
  loop: "{{ duckdb_extensions }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the session settings that every hunt session reads
  ansible.builtin.template:
    src: session.sql.j2
    dest: "{{ duckdb_session_path }}"
    owner: root
    group: root
    mode: "0644"
  register: duckdb_session

- name: Install the hunt command
  ansible.builtin.template:
    src: hunt.sh.j2
    dest: "{{ duckdb_hunt_command_path }}"
    owner: root
    group: root
    mode: "0755"
